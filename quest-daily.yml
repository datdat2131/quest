# =====================================================================
#  NHIEM VU NGAY  -  reset moi ngay (gio reset chinh o config.yml)
#  Sua file nay roi go  /quest admin reload  trong game.
#
#  >>> THEM NHIEM VU MOI: copy nguyen 1 khoi ben duoi, doi ten id (khong dau, khong cach)
#  >>> SUA PHAN THUONG:  sua dong "rewards:"
#
#  Cac loai (type) hay dung:
#    BREAK_BLOCK  dao block        targets: [STONE, DIRT]  (bo trong = bat ky block nao)
#    KILL_MOB     giet quai        targets: [ZOMBIE]       (bo trong = bat ky quai nao)
#    KILL_PLAYER  giet nguoi choi
#    WALK         di chuyen (so block)
#    PLAYTIME     thoi gian choi (so phut)
#    FISH  CRAFT  SMELT  PLACE_BLOCK  HARVEST ...  (xem README)
#
#  rewards:  money = tien | tokens = Astrax Token | exp = Quest EXP
#            items = vat pham   ["DIAMOND:2", "BREAD:16"]
#            commands = lenh console  ["give {player} diamond 1"]
# =====================================================================
settings:
  category: DAILY
  enabled: true
  display-name: "Nhiệm vụ ngày"
  reset: DAILY

quests:
  dao_block:
    name: "&7Đào block"
